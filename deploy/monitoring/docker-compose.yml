services:
  exporter:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "index.mjs"]
    user: node
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      HOST: 0.0.0.0
      PORT: 9108
      SP_MONITOR_TARGETS_FILE: /etc/stronghold/targets.json
      SP_MONITOR_INTERVAL_MS: 10000
      SP_MONITOR_TIMEOUT_MS: 5000
    volumes:
      - ./exporter:/app:ro
      - type: bind
        source: ./exporter/targets.json
        target: /etc/stronghold/targets.json
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - host.docker.internal:host-gateway
    expose:
      - "9108"

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    depends_on:
      - exporter
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/stronghold-alerts.yml:/etc/prometheus/stronghold-alerts.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  prometheus-data:
  grafana-data:
